# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
tokens:
  prefix: ":barrier: {theme}FoAntiDupe &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

commands:
  usage: "{prefix}:paper: Use {theme}/foantidupe <version|reload|editor>{muted}."
  no-permission: "{prefix}{bad}No permission{muted}."
  player-only: "{prefix}{bad}Only players can use this{muted}."
  reloaded: "{prefix}:emerald: {good}Reloaded {theme}config.yml{muted}, {theme}flag-rules.yml{muted}, and {theme}messages.yml{muted}."
  reload-failed: "{prefix}:redstone: {bad}Reload failed at {theme}{step}{muted}: {white}{error}{muted}."
  command-failed: "{prefix}{bad}Command failed: {white}{error}{muted}."

flags:
  alert: "{prefix}:redstone: {bad}Flag {theme}{player}{muted} matched {white}{item_sprite}{item}{muted} {theme}{rule}{muted}: {white}{reason}{muted}."
  view-action: " {theme}[click here to view their inventory]"
  view-opened: "{prefix}:chest: {good}Opened {theme}{player}{muted}'s live inventory."
  view-opened-read-only: "{prefix}:chest: {good}Opened {theme}{player}{muted}'s live inventory {white}(read-only){muted}."
  view-offline: "{prefix}{bad}Player is offline{muted}; live inventory is unavailable."
  view-player-only: "{prefix}{bad}Only players can open live inventories{muted}."

editor:
  saved: "{prefix}:emerald: {good}Saved {theme}{setting}{muted}."
  cancelled: "{prefix}{bad}Cancelled{muted}."
  invalid-number: "{prefix}{bad}Enter a whole number above zero{muted}, or type {theme}cancel{muted}."
  invalid-text: "{prefix}{bad}Enter text{muted}, or type {theme}cancel{muted}."
  save-failed: "{prefix}:redstone: {bad}Could not save {theme}{setting}{muted}: {white}{error}{muted}."
  hold-item: "{prefix}:paper: {bad}Hold an item on your cursor first{muted}."
  deleted-rule: "{prefix}:lava_bucket: {good}Deleted rule {theme}{rule}{muted}."
